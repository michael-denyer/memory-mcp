name: Publish

on:
  release:
    types: [published]
  workflow_dispatch: # re-run a failed leg without re-cutting the release

permissions:
  contents: read

# Queue rather than cancel: a cancelled publish can leave PyPI and the MCP
# registry out of step.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Verify release tag and CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # read the default-branch CI result for the exact tagged commit
    steps:
      - name: Require a protected version tag on a tested default-branch commit
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_PROTECTED == true && $GITHUB_REF_NAME =~ ^v[0-9] ]]
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$GITHUB_SHA" --jq .status)
          [[ $status == identical || $status == behind ]]
          ci=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push \
            --branch "$DEFAULT_BRANCH" --commit "$GITHUB_SHA" --limit 1 --json conclusion --jq '.[0].conclusion')
          [[ $ci == success ]]
          version=$(gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/pyproject.toml?ref=$GITHUB_SHA" \
            | python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["project"]["version"])')
          [[ $GITHUB_REF_NAME == "v$version" ]]

  build:
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false

      - name: Build package
        run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    environment: pypi
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1

  mcp-registry:
    name: Publish to MCP Registry
    needs: pypi
    environment: mcp-registry
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC auth to the registry — no secret needed
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The registry validates the package exists on PyPI, and the pypi job
      # finishing does not mean the index is serving it yet.
      - name: Wait for PyPI to serve the release
        run: |
          VERSION=$(jq -r '.version' server.json)
          echo "Waiting for hot-memory-mcp $VERSION on PyPI"
          for _ in $(seq 1 30); do
            if curl -fsL "https://pypi.org/pypi/hot-memory-mcp/${VERSION}/json" > /dev/null; then
              echo "PyPI is serving ${VERSION}"
              exit 0
            fi
            sleep 10
          done
          echo "PyPI never served ${VERSION} after 5 minutes" >&2
          exit 1

      - name: Install mcp-publisher
        run: |
          archive="$RUNNER_TEMP/mcp-publisher.tar.gz"
          curl --fail --location --show-error --output "$archive" https://github.com/modelcontextprotocol/registry/releases/download/v1.8.17/mcp-publisher_linux_amd64.tar.gz
          echo "4fbfe8236becd291a7a37b3e2cd7d5a6171ecf25c62a47f4fe92ef9b92007f9b  $archive" | sha256sum --check
          tar -xzf "$archive" mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
