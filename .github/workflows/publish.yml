name: Publish

on:
  release:
    types: [published]
  workflow_dispatch: # re-run a failed leg without re-cutting the release

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1

  mcp-registry:
    name: Publish to MCP Registry
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC auth to the registry — no secret needed
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      # The registry validates the package exists on PyPI, and the pypi job
      # finishing does not mean the index is serving it yet.
      - name: Wait for PyPI to serve the release
        run: |
          VERSION=$(jq -r '.version' server.json)
          echo "Waiting for hot-memory-mcp $VERSION on PyPI"
          for _ in $(seq 1 30); do
            if curl -fsL "https://pypi.org/pypi/hot-memory-mcp/${VERSION}/json" > /dev/null; then
              echo "PyPI is serving ${VERSION}"
              exit 0
            fi
            sleep 10
          done
          echo "PyPI never served ${VERSION} after 5 minutes" >&2
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
