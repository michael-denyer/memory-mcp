name: Workflow lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Workflow static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Audits the workflows themselves: template injection, over-broad
      # permissions, unpinned actions, credential persistence. Findings are
      # annotated on the diff. version defaults to "latest", so it is pinned
      # to keep a zizmor release from changing what this check means.
      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          version: "1.33.1"
          advanced-security: false
          annotations: true
          persona: pedantic
          min-severity: low
